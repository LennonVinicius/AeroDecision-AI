services:
  db:
    image: postgres:16
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: dumont_user
      POSTGRES_PASSWORD: dumont_pass
      POSTGRES_DB: dumont_network
    ports:
      - "5433:5432"
    volumes:
      - dumont_pgdata:/var/lib/postgresql/data
volumes:
  dumont_pgdata: